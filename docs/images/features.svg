<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" role="img" aria-labelledby="t d">
  <!-- Icons from Tabler Icons (MIT, tabler.io), the set the app uses. Labels are plain text: edit them here. -->
  <title id="t">What Atlas does</title>
  <desc id="d">Six features on a wheel round the Atlas name: reads whole folders, a source for every fact, exact numbers from code, compares revisions, voice calls and dictation, English and Arabic.</desc>
  <defs>
    <radialGradient id="ground" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#45423e"/>
      <stop offset="1" stop-color="#2a2825"/>
    </radialGradient>
    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .label { font-size: 14.5px; font-weight: 600; fill: #1b1917; }
    </style>
  </defs>
  <rect width="880" height="620" rx="24" fill="url(#ground)"/>
  <circle cx="440" cy="310" r="230" fill="none" stroke="#e4e3e0" stroke-width="8"/>
  <g transform="translate(418 218) scale(2.2)" fill="#f7f6f3">
