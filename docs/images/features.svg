  </g>
  <text x="440" y="316" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="-0.6" fill="#f7f6f3">Atlas</text>
  <text x="440" y="350" text-anchor="middle" font-size="16" fill="#b6b4b2">Every answer,</text>
  <text x="440" y="371" text-anchor="middle" font-size="16" fill="#b6b4b2">with its page.</text>

  <g>
    <circle cx="325" cy="110.8" r="84" fill="#211f1c"/>
    <circle cx="325" cy="110.8" r="71" fill="#fdfcfb"/>
